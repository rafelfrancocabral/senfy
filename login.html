<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Senfy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="index.html" aria-label="Senfy início" style="margin-bottom:1rem;">
        <img src="assets/logo.png" alt="" class="brand-logo" onerror="this.style.display='none'">
        <span class="brand-mark">S</span>
        <span>Senfy</span>
      </a>
      <div class="auth-head">
        <h1 style="font-size:1.8rem;">Acesse sua conta</h1>
        <p>Entre para acompanhar clientes, regras, prêmios e ações do seu programa de fidelidade.</p>
      </div>
      <form action="dashboard.html" method="get">
        <div class="field">
          <label for="email">E-mail
            <input class="input" id="email" name="email" type="email" placeholder="voce@empresa.com" autocomplete="email" required>
          </label>
        </div>
        <div class="field">
          <label for="senha">Senha
            <input class="input" id="senha" name="senha" type="password" placeholder="Sua senha" autocomplete="current-password" required>
          </label>
        </div>
        <div class="auth-meta">
          <label style="display:flex;align-items:center;gap:0.45rem;font-weight:500;color:var(--muted);">
            <input type="checkbox" name="lembrar"> Lembrar de mim
          </label>
          <a href="#" onclick="return false;" style="color:var(--accent);">Esqueci a senha</a>
        </div>
        <button class="btn btn-block" type="submit">Entrar</button>
      </form>
      <p class="auth-links">Ainda não tem conta? <a href="index.html#contato">Fale com a Senfy</a></p>
    </div>
    <p class="muted small" style="text-align:center;margin-top:1rem;">Ambiente de demonstração — autenticação será integrada em versões futuras.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>

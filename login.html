<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acessar — Senfy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="brand auth-brand" href="index.html" aria-label="Senfy início">
        <img class="brand-logo" src="assets/suricato.png" alt="" aria-hidden="true">
        <span class="brand-name">Senfy</span>
      </a>
      <div class="auth-head">
        <p class="eyebrow" id="auth-eyebrow">Acesso</p>
        <h1 id="auth-title">Acesse sua conta</h1>
        <p id="auth-subtitle">Entre para acompanhar clientes, regras, prêmios e ações do seu programa de fidelidade.</p>
      </div>

      <div class="auth-tabs" role="tablist" aria-label="Modo de acesso">
        <button class="auth-tab is-active" type="button" role="tab" aria-selected="true" data-auth-mode="login">Entrar</button>
        <button class="auth-tab" type="button" role="tab" aria-selected="false" data-auth-mode="signup">Criar conta</button>
      </div>

      <form id="auth-form" novalidate>
        <div class="field" data-auth-signup hidden>
          <label for="company-name">Nome da empresa
            <input class="input" id="company-name" name="company-name" type="text" placeholder="Ex.: Café Central" autocomplete="organization">
          </label>
        </div>
        <div class="field">
          <label for="email">E-mail
            <input class="input" id="email" name="email" type="email" placeholder="voce@empresa.com" autocomplete="email" required>
          </label>
        </div>
        <div class="field">
          <label for="password">Senha
            <input class="input" id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" autocomplete="current-password" minlength="8" required>
          </label>
        </div>
        <div class="field" data-auth-signup hidden>
          <label for="country">País
            <select class="input" id="country" name="country">
              <option value="BR" selected>Brasil (BRL)</option>
              <option value="PT">Portugal (EUR)</option>
            </select>
          </label>
        </div>

        <p class="auth-feedback" id="auth-feedback" role="status" aria-live="polite"></p>
        <button class="btn btn-block" id="auth-submit" type="submit">Entrar</button>
      </form>

      <p class="auth-links" id="auth-links">Ainda não tem conta? <button class="auth-link-btn" type="button" data-auth-switch="signup">Criar conta</button></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
